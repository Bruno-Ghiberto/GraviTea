components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/token/ endpoint. Include tenant_id in token payload.
  schemas:
    ComprobanteLink:
      type: object
      properties:
        comprobante_id:
          type: string
          format: uuid
        cbte_tipo:
          type: integer
        cbte_nro:
          type: integer
        status:
          type: string
        cae:
          type:
          - string
          - 'null'
        cae_fch_vto:
          type:
          - string
          - 'null'
        imp_total:
          type: string
        imp_neto:
          type: string
        imp_iva:
          type: string
        cbte_fch:
          type: string
      required:
      - cae
      - cae_fch_vto
      - cbte_fch
      - cbte_nro
      - cbte_tipo
      - comprobante_id
      - imp_iva
      - imp_neto
      - imp_total
      - status
    Customer:
      type: object
      description: 'Customer serializer for CRUD operations.


        Validates CUIT with Modulo-11. Provides condicion_iva_display

        as read-only computed field.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        cuit:
          type: string
          description: Tax ID (11 digits, Modulo-11 validated)
          maxLength: 11
        doc_tipo:
          enum:
          - 80
          - 86
          - 87
          - 89
          - 90
          - 91
          - 92
          - 93
          - 95
          - 96
          - 94
          - 99
          - 0
          type: integer
          x-spec-enum-id: 9c68951ebcb09fce
          description: 'Document type code (80=CUIT, 96=DNI, 99=CF)


            * `80` - CUIT

            * `86` - CUIL

            * `87` - CDI

            * `89` - Libreta de Enrolamiento

            * `90` - Libreta Cívica

            * `91` - CI Extranjera

            * `92` - En trámite

            * `93` - Acta de Nacimiento

            * `95` - CI Buenos Aires

            * `96` - DNI

            * `94` - Pasaporte

            * `99` - Doc. (Otro) / Sin identificar

            * `0` - CI Policía Federal'
          minimum: 0
          maximum: 32767
        condicion_iva:
          enum:
          - 1
          - 4
          - 5
          - 6
          - 7
          - 8
          - 9
          - 10
          - 13
          type: integer
          x-spec-enum-id: 10af7b39e6e0a5cc
          description: 'IVA condition — determines invoice type (A/B/C)


            * `1` - IVA Responsable Inscripto

            * `4` - IVA Sujeto Exento

            * `5` - Consumidor Final

            * `6` - Responsable Monotributo

            * `7` - Sujeto No Categorizado

            * `8` - Proveedor del Exterior

            * `9` - Cliente del Exterior

            * `10` - IVA Liberado – Ley Nº 19.640

            * `13` - Monotributista Social'
          minimum: 0
          maximum: 32767
        condicion_iva_display:
          type: string
          readOnly: true
        razon_social:
          type: string
          description: Legal business name or full name
          maxLength: 255
        domicilio:
          type: string
          description: Fiscal address
        email:
          type: string
          format: email
          maxLength: 254
        telefono:
          type: string
          maxLength: 50
        custom_data:
          description: Tenant-defined custom fields. Validated against TenantFieldDefinition.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - condicion_iva
      - condicion_iva_display
      - created_at
      - cuit
      - id
      - razon_social
      - updated_at
