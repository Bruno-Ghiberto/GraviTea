      description: JWT token obtained from /auth/token/ endpoint. Include tenant_id in token payload.
  schemas:
    BarcodeSearchRequestRequest:
      type: object
      description: Barcode search request body.
      properties:
        barcode:
          type: string
          minLength: 1
          description: Product barcode to search for
      required:
      - barcode
    BranchStock:
      type: object
      description: 'Branch stock serializer for read operations.


        Returns current stock level per branch including product,

        reserved quantity, and computed available quantity.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        branch:
          type: string
          format: uuid
          description: Branch
        branch_name:
          type: string
          readOnly: true
        product:
          type: string
          format: uuid
          description: Product
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,4})?$
          description: Current stock quantity
        reserved_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,4})?$
          description: Reserved stock (pending orders)
        available_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,4})?$
          readOnly: true
        last_updated:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp of last update
      required:
      - available_quantity
      - branch
      - branch_name
      - id
      - last_updated
      - product
    Category:
      type: object
      description: 'Product category serializer for read operations.


        Returns category details with parent hierarchy and immediate children.'
      properties:
