    StockMovement:
      type: object
      description: 'Stock movement serializer for read operations.


        Returns movement details with product and branch info.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
          description: Product being moved
        product_sku:
          type: string
          readOnly: true
        product_name:
          type: string
          readOnly: true
        branch:
          type: string
          format: uuid
          description: Branch where movement occurred
        branch_name:
          type: string
          readOnly: true
        type:
          enum:
          - SALE
          - PURCHASE
          - ADJ
          - TRANS_IN
          - TRANS_OUT
          type: string
          x-spec-enum-id: 129912e1d6329677
          description: 'Type of stock movement (PostgreSQL ENUM)


            * `SALE` - Sale

            * `PURCHASE` - Purchase

            * `ADJ` - Adjustment

            * `TRANS_IN` - Transfer In

            * `TRANS_OUT` - Transfer Out'
        quantity_delta:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,4})?$
          description: Quantity moved (positive=in, negative=out)
        cost_snapshot:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,4})?$
          description: Cost per unit at time of movement
        total_value:
          type: string
          readOnly: true
        reference_id:
          type:
          - string
          - 'null'
          format: uuid
          description: External reference (SaleID, PurchaseID, etc.)
        notes:
          type:
          - string
          - 'null'
          description: Movement notes
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - branch
      - branch_name
      - created_at
      - id
      - product
      - product_name
      - product_sku
      - quantity_delta
      - total_value
      - type
