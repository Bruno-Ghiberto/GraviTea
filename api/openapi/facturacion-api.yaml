components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/token/ endpoint. Include tenant_id in token payload.
  schemas:
    ARCACredentialRead:
      type: object
      description: 'ARCACredential serializer for read operations.


        Redacts private_key_pem — never exposes secrets over the API.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        cuit_holder:
          type: string
          readOnly: true
          description: Certificate holder CUIT (11 digits, no hyphens)
        cuit_represented:
          type:
          - string
          - 'null'
          readOnly: true
          description: Represented company CUIT (delegation model)
        is_production:
          type: boolean
          readOnly: true
          description: True=production, False=homologacion
        is_active:
          type: boolean
          readOnly: true
          description: Soft-disable without deletion
        certificate_expires_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: Certificate expiration (for system check warnings)
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - certificate_expires_at
      - created_at
      - cuit_holder
      - cuit_represented
      - id
      - is_active
      - is_production
      - updated_at
    ARCACredentialWriteRequest:
      type: object
      description: 'ARCACredential serializer for create/update operations.


        Validates PEM format, CUIT check digit, and environment

        uniqueness per tenant.'
      properties:
        cuit_holder:
          type: string
          minLength: 1
          description: Certificate holder CUIT (11 digits, no hyphens)
          maxLength: 11
        cuit_represented:
          type:
          - string
          - 'null'
          description: Represented company CUIT (delegation model)
        certificate_pem:
          type: string
          minLength: 1
          description: X.509 certificate in PEM format
        private_key_pem:
          type: string
          minLength: 1
          description: RSA private key (AES-256-GCM encrypted at rest)
        is_production:
          type: boolean
          description: True=production, False=homologacion
      required:
      - certificate_pem
      - cuit_holder
      - private_key_pem
    AlicIvaEmitRequest:
      type: object
      description: Nested writable serializer for IVA rate breakdown entries.
      properties:
        iva_id:
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 8
          - 9
          type: integer
          x-spec-enum-id: ef1f4484bfcc3f9f
          description: 'ARCA IVA code (3=0%, 4=10.5%, 5=21%, 6=27%, 8=5%, 9=2.5%)


            * `1` - No Gravado

            * `2` - Exento

            * `3` - 0%

            * `4` - 10.5%

            * `5` - 21%

            * `6` - 27%

            * `8` - 5%

            * `9` - 2.5%'
        base_imp:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,3})?$
          description: Taxable base amount
        importe:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,3})?$
          description: IVA amount
      required:
      - base_imp
      - importe
      - iva_id
    AlicIvaRead:
      type: object
      description: Read-only serializer for IVA rate breakdown entries.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        iva_id:
          type: integer
          readOnly: true
          description: ARCA IVA code (3=0%, 4=10.5%, 5=21%, 6=27%, 8=5%, 9=2.5%)
        base_imp:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,3})?$
          readOnly: true
          description: Taxable base amount
        importe:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,3})?$
          readOnly: true
          description: IVA amount
      required:
      - base_imp
      - id
      - importe
      - iva_id
    CAEARead:
      type: object
      description: Read-only serializer for CAEA objects.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        punto_venta:
          type: string
          format: uuid
          readOnly: true
          description: Associated punto de venta
        punto_venta_numero:
          type: integer
          readOnly: true
        caea_code:
          type: string
          readOnly: true
          description: 14-digit CAEA from ARCA
        periodo:
          type: string
          readOnly: true
          description: Period YYYYMM
        orden:
          type: integer
          readOnly: true
          description: 1=first quincena, 2=second
        fch_vig_desde:
          type: string
          format: date
          readOnly: true
          description: Validity start date
        fch_vig_hasta:
          type: string
          format: date
          readOnly: true
          description: Validity end date
        fch_tope_inf:
          type: string
          format: date
          readOnly: true
          description: Reporting deadline
        status:
          enum:
          - ACTIVE
          - REPORTED
          - REPORTED_NO_MOVEMENT
          - EXPIRED
          type: string
          x-spec-enum-id: 92bfd34629f0de54
          readOnly: true
          description: 'CAEA lifecycle status


            * `ACTIVE` - Activo

            * `REPORTED` - Informado

            * `REPORTED_NO_MOVEMENT` - Sin movimiento informado

            * `EXPIRED` - Vencido'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - caea_code
      - created_at
      - fch_tope_inf
      - fch_vig_desde
      - fch_vig_hasta
      - id
      - orden
      - periodo
      - punto_venta
      - punto_venta_numero
      - status
    CAEASolicitarRequest:
      type: object
      description: Write serializer for requesting a new CAEA from ARCA.
      properties:
        punto_venta:
          type: string
          format: uuid
          description: UUID of the PuntoDeVenta to request CAEA for.
        periodo:
          type: string
          minLength: 1
          description: Period in YYYYMM format (e.g. '202602').
          pattern: ^\d{6}$
        orden:
          enum:
          - 1
          - 2
          type: integer
          x-spec-enum-id: bab8dbc6f38f8916
          description: '1 = first quincena, 2 = second quincena.


            * `1` - Primera quincena

            * `2` - Segunda quincena'
      required:
      - orden
      - periodo
      - punto_venta
    CbteAsocEmitRequest:
      type: object
      description: Nested writable serializer for associated comprobante references.
      properties:
        tipo:
          enum:
          - 1
          - 2
          - 3
          - 6
          - 7
          - 8
          - 11
          - 12
          - 13
          - 51
          - 52
          - 53
          type: integer
          x-spec-enum-id: 4a0ecf299727e908
          description: 'Associated CbteTipo code


            * `1` - Factura A

            * `2` - Nota de Débito A

            * `3` - Nota de Crédito A

            * `6` - Factura B

            * `7` - Nota de Débito B

            * `8` - Nota de Crédito B

            * `11` - Factura C

            * `12` - Nota de Débito C

            * `13` - Nota de Crédito C

            * `51` - Factura M

            * `52` - Nota de Débito M

            * `53` - Nota de Crédito M'
        pto_vta:
          type: integer
          maximum: 99999
          minimum: 1
          description: Associated punto de venta number
        nro:
          type: integer
          minimum: 1
          description: Associated comprobante number
        cuit:
          type: string
          minLength: 1
          description: Associated CUIT (defaults to emitter CUIT)
          maxLength: 11
      required:
      - nro
      - pto_vta
      - tipo
    CbteAsocRead:
      type: object
      description: Read-only serializer for associated comprobante references.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tipo:
          type: integer
          readOnly: true
          description: Associated CbteTipo code
        pto_vta:
          type: integer
          readOnly: true
          description: Associated PtoVta number
        nro:
          type: integer
          readOnly: true
          description: Associated CbteNro
        cuit:
          type:
          - string
          - 'null'
          readOnly: true
          description: Associated emitter CUIT (optional)
      required:
      - cuit
      - id
      - nro
      - pto_vta
      - tipo
    ComprobanteEmitirRequest:
      type: object
      description: 'Serializer for CAE invoice issuance (FECAESolicitar).


        Accepts comprobante data with nested AlicIva, Tributo, and CbteAsoc

        entries. Runs all ARCA validators (amounts, IVA breakdown, service

        dates, tributos, CbtesAsoc type compatibility) in the validate() method.


        This is a plain Serializer (not ModelSerializer) because the service

        layer handles Comprobante creation after ARCA authorization.'
      properties:
        punto_venta:
          type: string
          format: uuid
          description: UUID of the PuntoDeVenta to issue against
        cbte_tipo:
          enum:
          - 1
          - 2
          - 3
          - 6
          - 7
          - 8
          - 11
          - 12
          - 13
          - 51
          - 52
          - 53
          type: integer
          x-spec-enum-id: 4a0ecf299727e908
          description: 'CbteTipo code


            * `1` - Factura A

            * `2` - Nota de Débito A

            * `3` - Nota de Crédito A

            * `6` - Factura B

            * `7` - Nota de Débito B

            * `8` - Nota de Crédito B

            * `11` - Factura C

            * `12` - Nota de Débito C

            * `13` - Nota de Crédito C

            * `51` - Factura M

            * `52` - Nota de Débito M

            * `53` - Nota de Crédito M'
        concepto:
          enum:
          - 1
          - 2
          - 3
          type: integer
          x-spec-enum-id: b43c52857d81dac2
          description: '1=Productos, 2=Servicios, 3=Ambos


            * `1` - Productos

            * `2` - Servicios

            * `3` - Productos y Servicios'
        doc_tipo:
          enum:
          - 80
          - 86
          - 87
          - 89
          - 90
          - 91
          - 92
          - 93
          - 95
          - 96
          - 94
          - 99
          - 0
          type: integer
          x-spec-enum-id: 9c68951ebcb09fce
          description: 'Buyer document type code


            * `80` - CUIT

            * `86` - CUIL

            * `87` - CDI

            * `89` - Libreta de Enrolamiento

            * `90` - Libreta Cívica

