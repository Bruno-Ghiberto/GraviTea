components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/token/ endpoint. Include tenant_id in token payload.
  schemas:
    GoodsReceipt:
      type: object
      description: GoodsReceipt read serializer with nested lines.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        purchase_order:
          type: string
          format: uuid
          readOnly: true
        receipt_number:
          type: string
          readOnly: true
          description: Unique receipt number per tenant
        receipt_date:
          type: string
          format: date
          readOnly: true
          description: Date goods arrived
        received_by:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: User who received the goods
        notes:
          type:
          - string
          - 'null'
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/GoodsReceiptLine'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - lines
      - notes
      - purchase_order
      - receipt_date
      - receipt_number
      - received_by
    GoodsReceiptLine:
      type: object
      description: GoodsReceiptLine serializer — nested inside GoodsReceiptSerializer.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        purchase_order_item:
          type: string
          format: uuid
        product:
          type: string
          format: uuid
          readOnly: true
          description: Denormalized from PO item for easy access
        quantity_received:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,3})?$
          description: Quantity received (> 0)
      required:
      - id
      - product
      - purchase_order_item
    PaginatedGoodsReceiptList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/GoodsReceipt'
    PaginatedPurchaseOrderList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrder'
    PaginatedSupplierList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Supplier'
    PatchedPurchaseOrderRequest:
      type: object
      description: 'PurchaseOrder serializer with nested writable items and custom fields.


        On create: items are created inline, custom_data validated.

        On update: items are replaced (delete existing + create new) for DRAFT POs.'
      properties:
        supplier:
          type: string
          format: uuid
          description: Cannot delete supplier with open POs
        order_number:
          type: string
          minLength: 1
          description: Unique order number per tenant
