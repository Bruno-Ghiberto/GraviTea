openapi: 3.1.0
info:
  title: Gravitea Procurement (Compras) API
  version: 1.0.0
  description: 'Procurement management including purchase orders, goods receipts, and supplier management.


    ## Authentication

    All endpoints require JWT Bearer authentication (unless noted otherwise).


    ## Multi-Tenant

    Resources are automatically filtered by tenant_id from JWT claims.'
  contact:
    name: Gravitea Development Team
    email: dev@gravitea.com
  license:
    name: Proprietary
servers:
- url: http://localhost:8000/api/v1
  description: Development
- url: https://api.gravitea.app/api/v1
  description: Production
security:
- bearerAuth: []
paths:
  /api/v1/compras/goods-receipts/:
    get:
      operationId: compras_goods_receipts_list
      description: "Goods Receipt read-only viewset (standalone list + detail).\n\nEndpoints:\n    GET /api/v1/compras/goods-receipts/\
        \       - List all receipts\n    GET /api/v1/compras/goods-receipts/{id}/   - Get receipt detail\n\nCreation is handled\
        \ via PurchaseOrderViewSet.receive action.\nNo update or delete — GoodsReceipt is immutable."
      parameters:
      - name: cursor
        required: false
        in: query
        description: El valor del cursor de paginación.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - compras
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGoodsReceiptList'
          description: ''
  /api/v1/compras/goods-receipts/{id}/:
    get:
      operationId: compras_goods_receipts_retrieve
      description: "Goods Receipt read-only viewset (standalone list + detail).\n\nEndpoints:\n    GET /api/v1/compras/goods-receipts/\
        \       - List all receipts\n    GET /api/v1/compras/goods-receipts/{id}/   - Get receipt detail\n\nCreation is handled\
        \ via PurchaseOrderViewSet.receive action.\nNo update or delete — GoodsReceipt is immutable."
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - compras
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceipt'
          description: ''
  /api/v1/compras/purchase-orders/:
    get:
      operationId: compras_purchase_orders_list
      description: "PurchaseOrder management with state machine actions.\n\nEndpoints:\n    GET    /api/v1/compras/purchase-orders/\
        \                - List POs\n    POST   /api/v1/compras/purchase-orders/                - Create PO (DRAFT)\n    GET\
        \    /api/v1/compras/purchase-orders/{id}/           - Get PO detail\n    PATCH  /api/v1/compras/purchase-orders/{id}/\
        \           - Update PO (mutable fields by state)\n    DELETE /api/v1/compras/purchase-orders/{id}/           - Delete\
        \ DRAFT PO only\n    POST   /api/v1/compras/purchase-orders/{id}/confirm/   - DRAFT → CONFIRMED\n    POST   /api/v1/compras/purchase-orders/{id}/cancel/\
        \    - → CANCELLED"
      parameters:
      - name: cursor
        required: false
        in: query
        description: El valor del cursor de paginación.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - compras
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPurchaseOrderList'
          description: ''
    post:
      operationId: compras_purchase_orders_create
      description: "PurchaseOrder management with state machine actions.\n\nEndpoints:\n    GET    /api/v1/compras/purchase-orders/\
        \                - List POs\n    POST   /api/v1/compras/purchase-orders/                - Create PO (DRAFT)\n    GET\
        \    /api/v1/compras/purchase-orders/{id}/           - Get PO detail\n    PATCH  /api/v1/compras/purchase-orders/{id}/\
        \           - Update PO (mutable fields by state)\n    DELETE /api/v1/compras/purchase-orders/{id}/           - Delete\
        \ DRAFT PO only\n    POST   /api/v1/compras/purchase-orders/{id}/confirm/   - DRAFT → CONFIRMED\n    POST   /api/v1/compras/purchase-orders/{id}/cancel/\
        \    - → CANCELLED"
      tags:
      - compras
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
          description: ''
  /api/v1/compras/purchase-orders/{id}/:
    get:
      operationId: compras_purchase_orders_retrieve
      description: "PurchaseOrder management with state machine actions.\n\nEndpoints:\n    GET    /api/v1/compras/purchase-orders/\
        \                - List POs\n    POST   /api/v1/compras/purchase-orders/                - Create PO (DRAFT)\n    GET\
        \    /api/v1/compras/purchase-orders/{id}/           - Get PO detail\n    PATCH  /api/v1/compras/purchase-orders/{id}/\
        \           - Update PO (mutable fields by state)\n    DELETE /api/v1/compras/purchase-orders/{id}/           - Delete\
        \ DRAFT PO only\n    POST   /api/v1/compras/purchase-orders/{id}/confirm/   - DRAFT → CONFIRMED\n    POST   /api/v1/compras/purchase-orders/{id}/cancel/\
        \    - → CANCELLED"
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - compras
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
          description: ''
    put:
      operationId: compras_purchase_orders_update
      description: "PurchaseOrder management with state machine actions.\n\nEndpoints:\n    GET    /api/v1/compras/purchase-orders/\
        \                - List POs\n    POST   /api/v1/compras/purchase-orders/                - Create PO (DRAFT)\n    GET\
        \    /api/v1/compras/purchase-orders/{id}/           - Get PO detail\n    PATCH  /api/v1/compras/purchase-orders/{id}/\
        \           - Update PO (mutable fields by state)\n    DELETE /api/v1/compras/purchase-orders/{id}/           - Delete\
        \ DRAFT PO only\n    POST   /api/v1/compras/purchase-orders/{id}/confirm/   - DRAFT → CONFIRMED\n    POST   /api/v1/compras/purchase-orders/{id}/cancel/\
        \    - → CANCELLED"
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - compras
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
          description: ''
    patch:
      operationId: compras_purchase_orders_partial_update
      description: "PurchaseOrder management with state machine actions.\n\nEndpoints:\n    GET    /api/v1/compras/purchase-orders/\
        \                - List POs\n    POST   /api/v1/compras/purchase-orders/                - Create PO (DRAFT)\n    GET\
        \    /api/v1/compras/purchase-orders/{id}/           - Get PO detail\n    PATCH  /api/v1/compras/purchase-orders/{id}/\
        \           - Update PO (mutable fields by state)\n    DELETE /api/v1/compras/purchase-orders/{id}/           - Delete\
        \ DRAFT PO only\n    POST   /api/v1/compras/purchase-orders/{id}/confirm/   - DRAFT → CONFIRMED\n    POST   /api/v1/compras/purchase-orders/{id}/cancel/\
        \    - → CANCELLED"
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - compras
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPurchaseOrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPurchaseOrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPurchaseOrderRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
          description: ''
    delete:
      operationId: compras_purchase_orders_destroy
      description: "PurchaseOrder management with state machine actions.\n\nEndpoints:\n    GET    /api/v1/compras/purchase-orders/\
        \                - List POs\n    POST   /api/v1/compras/purchase-orders/                - Create PO (DRAFT)\n    GET\
        \    /api/v1/compras/purchase-orders/{id}/           - Get PO detail\n    PATCH  /api/v1/compras/purchase-orders/{id}/\
        \           - Update PO (mutable fields by state)\n    DELETE /api/v1/compras/purchase-orders/{id}/           - Delete\
        \ DRAFT PO only\n    POST   /api/v1/compras/purchase-orders/{id}/confirm/   - DRAFT → CONFIRMED\n    POST   /api/v1/compras/purchase-orders/{id}/cancel/\
        \    - → CANCELLED"
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - compras
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/compras/purchase-orders/{id}/cancel/:
    post:
      operationId: compras_purchase_orders_cancel_create
      description: Transition PO to CANCELLED from DRAFT/CONFIRMED/PARTIAL_RECEIVED.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - compras
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
          description: ''
  /api/v1/compras/purchase-orders/{id}/confirm/:
    post:
      operationId: compras_purchase_orders_confirm_create
      description: Transition PO from DRAFT to CONFIRMED.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - compras
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
          description: ''
  /api/v1/compras/purchase-orders/{id}/receive/:
    post:
      operationId: compras_purchase_orders_receive_create
      description: 'Create a goods receipt against this PO.


        POST /api/v1/compras/purchase-orders/{id}/receive/

        Body: {receipt_number, branch, lines: [{purchase_order_item_id, quantity_received}], notes?}'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - compras
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
          description: ''
  /api/v1/compras/suppliers/:
    get:
      operationId: compras_suppliers_list
      description: "Supplier management viewset.\n\nEndpoints:\n    GET    /api/v1/compras/suppliers/             - List suppliers\n\
        \    POST   /api/v1/compras/suppliers/             - Create supplier\n    GET    /api/v1/compras/suppliers/{id}/ \
        \       - Get supplier details\n    PATCH  /api/v1/compras/suppliers/{id}/        - Update supplier\n    DELETE /api/v1/compras/suppliers/{id}/\
        \        - Soft delete (set is_active=False)\n    GET    /api/v1/compras/suppliers/search/?q={query} - Search by tax_id\
        \ or email"
      parameters:
      - name: cursor
        required: false
        in: query
        description: El valor del cursor de paginación.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - compras
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSupplierList'
          description: ''
    post:
      operationId: compras_suppliers_create
      description: "Supplier management viewset.\n\nEndpoints:\n    GET    /api/v1/compras/suppliers/             - List suppliers\n\
        \    POST   /api/v1/compras/suppliers/             - Create supplier\n    GET    /api/v1/compras/suppliers/{id}/ \
        \       - Get supplier details\n    PATCH  /api/v1/compras/suppliers/{id}/        - Update supplier\n    DELETE /api/v1/compras/suppliers/{id}/\
        \        - Soft delete (set is_active=False)\n    GET    /api/v1/compras/suppliers/search/?q={query} - Search by tax_id\
