        \       - Get supplier details\n    PATCH  /api/v1/compras/suppliers/{id}/        - Update supplier\n    DELETE /api/v1/compras/suppliers/{id}/\
        \        - Soft delete (set is_active=False)\n    GET    /api/v1/compras/suppliers/search/?q={query} - Search by tax_id\
        \ or email"
