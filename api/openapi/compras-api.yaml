            schema:
              $ref: '#/components/schemas/SupplierCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupplierCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupplierCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierCreate'
          description: ''
  /api/v1/compras/suppliers/search/:
    get:
      operationId: compras_suppliers_search_retrieve
      description: 'Search suppliers by tax_id or email using blind indexes.


        Query param: ?q=search_term


        Uses blind index for privacy-preserving search.'
      tags:
      - compras
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
