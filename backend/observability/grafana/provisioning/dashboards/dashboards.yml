# Grafana Dashboard Provisioning
# Auto-loads dashboards from directory on startup

apiVersion: 1

providers:
  - name: 'GRAVITEA Dashboards'
    orgId: 1
    folder: 'GRAVITEA'
    folderUid: 'gravitea'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
