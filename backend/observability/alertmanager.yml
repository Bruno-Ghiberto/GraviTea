# Alertmanager Configuration for GRAVITEA ERP
# Per 004-observability-metrics spec FR-021 through FR-025
#
# This configuration routes alerts based on severity and team.
# Update receiver configurations with actual webhook URLs and credentials.

global:
  # Resolve alerts after 5 minutes of no firing
  resolve_timeout: 5m

  # SMTP settings for email notifications (configure as needed)
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alertmanager@gravitea.com'
  # smtp_auth_username: 'alertmanager'
  # smtp_auth_password: '{{ .EmailPassword }}'

  # Slack settings (configure as needed)
  # slack_api_url: '{{ .SlackWebhookURL }}'

# Alert routing configuration
route:
  # Default receiver for unmatched alerts
  receiver: 'default-receiver'

  # Group alerts by these labels
  group_by: ['alertname', 'severity', 'tenant_id']

  # Wait before sending first notification
  group_wait: 30s

  # Wait before sending updated notifications
  group_interval: 5m

  # Wait before resending a notification
  repeat_interval: 4h

  # Child routes for specific alert types
  routes:
    # Critical alerts go to on-call immediately
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      continue: true

    # Platform team alerts
    - match:
        team: platform
      receiver: 'platform-team'
      group_wait: 30s
      continue: true

    # Backend team alerts
    - match:
        team: backend
      receiver: 'backend-team'
      group_wait: 30s
      continue: true

    # Security team alerts (high priority)
    - match:
        team: security
      receiver: 'security-team'
      group_wait: 10s
      repeat_interval: 30m
      continue: true

    # Business alerts (lower priority)
    - match:
        team: business
      receiver: 'business-team'
      group_wait: 5m
      repeat_interval: 8h

# Receivers define notification targets
receivers:
  # Default receiver - logs to console in dev
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://localhost:9095/webhook'
        send_resolved: true

  # Critical alerts - PagerDuty + Slack
  - name: 'critical-alerts'
    # PagerDuty integration (configure service key)
    # pagerduty_configs:
    #   - service_key: '{{ .PagerDutyKey }}'
    #     severity: critical
    #     description: '{{ .CommonAnnotations.summary }}'
    #     details:
    #       firing: '{{ .Alerts.Firing | len }}'
    #       resolved: '{{ .Alerts.Resolved | len }}'

    # Slack integration for critical alerts
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/PLACEHOLDER/PLACEHOLDER/PLACEHOLDER'
        channel: '#alerts-critical'
        send_resolved: true
        title: '{{ .Status | toUpper }}: {{ .CommonAnnotations.summary }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  # Platform team notifications
  - name: 'platform-team'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/PLACEHOLDER/PLACEHOLDER/PLACEHOLDER'
        channel: '#alerts-platform'
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'

  # Backend team notifications
  - name: 'backend-team'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/PLACEHOLDER/PLACEHOLDER/PLACEHOLDER'
        channel: '#alerts-backend'
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'

  # Security team notifications (high priority channel)
  - name: 'security-team'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/PLACEHOLDER/PLACEHOLDER/PLACEHOLDER'
        channel: '#alerts-security'
        send_resolved: true
        title: ':warning: Security Alert: {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'
        color: 'warning'

  # Business team notifications
  - name: 'business-team'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/PLACEHOLDER/PLACEHOLDER/PLACEHOLDER'
        channel: '#alerts-business'
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'

# Inhibition rules prevent redundant alerts
inhibit_rules:
  # Inhibit warning alerts when critical alert is firing for same alertname
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'tenant_id']

  # Inhibit info alerts when warning or critical is firing
  - source_match_re:
      severity: 'critical|warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'tenant_id']

# Templates for notification formatting
templates:
  - '/etc/alertmanager/templates/*.tmpl'
