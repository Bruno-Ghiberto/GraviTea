[pytest]
DJANGO_SETTINGS_MODULE = gravitea.settings.test_postgres
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test discovery
testpaths = tests

# Coverage configuration
# Note: --cov-fail-under is NOT included here because it should only apply
# to full test runs, not marker-specific runs (unit, integration, etc.)
# The test orchestrator (scripts/run_tests.py) adds it conditionally.
addopts =
    --reuse-db
    --cov=apps
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=json
    -v
    --strict-markers
    --timeout=300
    --tb=short
    -p tests.plugins.json_logging

# Default JSON log path (overridden by orchestrator)
json_log = tests/Logs_report/latest/test_events.jsonl

# JUnit XML output for CI/CD
junit_family = xunit2
junit_logging = all
junit_log_passing_tests = true
junit_duration_report = total

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require database)
    performance: Performance and N+1 detection tests
    slow: Slow-running tests
    critical: Critical path tests requiring 95% coverage
    security: Security tests (JWT attacks, rate limiting, encryption, tenant isolation)
    docker: Docker integration tests (health checks, graceful shutdown, network)
    property: Property-based tests using Hypothesis
    load: Load tests using Locust (baseline, peak, sustained)
    fuzz: API fuzzing tests using Schemathesis
    traceability: Test-to-requirement traceability tests
    owasp: OWASP Top 10 security compliance tests
    jwt: JWT-specific security tests
    ratelimit: Rate limiting tests
    encryption: Encryption and PII protection tests
    tenant_isolation: Multi-tenant isolation tests
    concurrent: Concurrent operation tests
    smoke: Smoke tests that make REAL HTTP requests to running services
    observability: Observability stack tests (Prometheus, Grafana, Jaeger, Loki)
    strict: Strict validation tests that FAIL (not skip) when services are down

# Hypothesis settings are configured in tests/conftest.py
# Do not add hypothesis_profile here - it's not a valid pytest option

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Console output
console_output_style = progress

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/Logs_report/latest/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
