# Security Testing CI Workflow
# Runs OWASP and security-focused tests
# FR-001-012: Security requirements validation

name: Security Tests

on:
  # Manual trigger for security scans
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - owasp
          - jwt
          - injection
          - dependencies

  # Run on schedule (daily security scan)
  schedule:
    - cron: '0 3 * * *'  # Every day at 3 AM

  # Run on PR to main
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'requirements/**'

  # Run on push to main
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'requirements/**'

env:
  PYTHON_VERSION: '3.12'

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install safety
        run: pip install safety pip-audit

      - name: Run pip-audit
        working-directory: backend
        continue-on-error: true
        run: |
          echo "## Dependency Audit Results" >> $GITHUB_STEP_SUMMARY
          pip-audit -r requirements/base.txt --format markdown >> $GITHUB_STEP_SUMMARY 2>&1 || true

      - name: Run safety check
        working-directory: backend
        continue-on-error: true
        run: |
          echo "## Safety Check Results" >> $GITHUB_STEP_SUMMARY
          safety check -r requirements/base.txt --full-report >> $GITHUB_STEP_SUMMARY 2>&1 || true

  owasp-tests:
    name: OWASP Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gravitea_test
          POSTGRES_PASSWORD: gravitea_test
          POSTGRES_DB: gravitea_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run OWASP tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: gravitea.settings.test
          DATABASE_URL: postgresql://gravitea_test:gravitea_test@localhost:5432/gravitea_test
        run: |
          echo "## OWASP Test Results" >> $GITHUB_STEP_SUMMARY
          pytest tests/ -v -m owasp --tb=short --no-header -q 2>&1 | tee owasp-results.txt
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat owasp-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload OWASP results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-test-results
          path: backend/owasp-results.txt
          retention-days: 30

  jwt-security-tests:
    name: JWT Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gravitea_test
          POSTGRES_PASSWORD: gravitea_test
          POSTGRES_DB: gravitea_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run JWT security tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: gravitea.settings.test
          DATABASE_URL: postgresql://gravitea_test:gravitea_test@localhost:5432/gravitea_test
        run: |
          echo "## JWT Security Test Results" >> $GITHUB_STEP_SUMMARY
          pytest tests/ -v -m jwt --tb=short --no-header -q 2>&1 | tee jwt-results.txt
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat jwt-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload JWT test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jwt-test-results
          path: backend/jwt-results.txt
          retention-days: 30

  security-marker-tests:
    name: Security Marker Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gravitea_test
          POSTGRES_PASSWORD: gravitea_test
          POSTGRES_DB: gravitea_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run all security tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: gravitea.settings.test
          DATABASE_URL: postgresql://gravitea_test:gravitea_test@localhost:5432/gravitea_test
        run: |
          echo "## All Security Test Results" >> $GITHUB_STEP_SUMMARY
          echo "### Rate Limiting Tests" >> $GITHUB_STEP_SUMMARY
          pytest tests/ -v -m ratelimit --tb=short -q 2>&1 | head -50 || true

          echo "### Encryption Tests" >> $GITHUB_STEP_SUMMARY
          pytest tests/ -v -m encryption --tb=short -q 2>&1 | head -50 || true

          echo "### Tenant Isolation Tests" >> $GITHUB_STEP_SUMMARY
          pytest tests/ -v -m tenant_isolation --tb=short -q 2>&1 | head -50 || true

          echo "### Full Security Suite" >> $GITHUB_STEP_SUMMARY
          pytest tests/ -v -m security --tb=short --no-header -q 2>&1 | tee security-results.txt
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 security-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload security results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results
          path: backend/security-results.txt
          retention-days: 30

  fuzz-tests:
    name: API Fuzzing Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event.inputs.scan_type == 'all'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gravitea_test
          POSTGRES_PASSWORD: gravitea_test
          POSTGRES_DB: gravitea_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt
          pip install schemathesis

      - name: Run fuzz tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: gravitea.settings.test
          DATABASE_URL: postgresql://gravitea_test:gravitea_test@localhost:5432/gravitea_test
        run: |
          echo "## Fuzz Test Results" >> $GITHUB_STEP_SUMMARY
          pytest tests/ -v -m fuzz --tb=short --timeout=600 -q 2>&1 | tee fuzz-results.txt || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -30 fuzz-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload fuzz results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-test-results
          path: backend/fuzz-results.txt
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, owasp-tests, jwt-security-tests, security-marker-tests]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# Security Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OWASP Tests | ${{ needs.owasp-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| JWT Security | ${{ needs.jwt-security-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Markers | ${{ needs.security-marker-tests.result }} |" >> $GITHUB_STEP_SUMMARY
