openapi: 3.0.3
info:
  title: GRAVITEA-ERP Compras API
  description: Purchase management endpoints — suppliers, purchase orders, goods receipts
  version: 1.0.0

servers:
  - url: /api/v1/compras
    description: Compras module base URL

paths:
  /suppliers/:
    get:
      operationId: listSuppliers
      summary: List suppliers for current tenant
      tags: [Suppliers]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or tax ID hash
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated supplier list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSupplierList"
    post:
      operationId: createSupplier
      summary: Create a new supplier
      tags: [Suppliers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierCreate"
      responses:
        "201":
          description: Supplier created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "400":
          $ref: "#/components/responses/ValidationError"

  /suppliers/{id}/:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getSupplier
      summary: Retrieve a supplier
      tags: [Suppliers]
      responses:
        "200":
          description: Supplier details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateSupplier
      summary: Full update of a supplier
      tags: [Suppliers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierCreate"
      responses:
        "200":
          description: Supplier updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    patch:
      operationId: partialUpdateSupplier
      summary: Partial update of a supplier
      tags: [Suppliers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierPatch"
      responses:
        "200":
          description: Supplier updated
    delete:
      operationId: deleteSupplier
      summary: Delete a supplier
      tags: [Suppliers]
      responses:
        "204":
          description: Supplier deleted
        "409":
          description: Supplier has open purchase orders

  /purchase-orders/:
    get:
      operationId: listPurchaseOrders
      summary: List purchase orders for current tenant
      tags: [PurchaseOrders]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, CONFIRMED, PARTIAL_RECEIVED, RECEIVED, CANCELLED]
        - name: supplier_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated purchase order list
    post:
      operationId: createPurchaseOrder
      summary: Create a purchase order with line items
      tags: [PurchaseOrders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrderCreate"
      responses:
        "201":
          description: Purchase order created in DRAFT state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "400":
          $ref: "#/components/responses/ValidationError"

  /purchase-orders/{id}/:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getPurchaseOrder
      summary: Retrieve a purchase order with all line items
      tags: [PurchaseOrders]
      responses:
        "200":
          description: Purchase order details with nested items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
    put:
      operationId: updatePurchaseOrder
      summary: Full update (DRAFT only)
      tags: [PurchaseOrders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrderCreate"
      responses:
        "200":
          description: Updated
        "409":
          description: Order not in DRAFT state
    patch:
      operationId: partialUpdatePurchaseOrder
      summary: Partial update (allowed fields depend on state)
      tags: [PurchaseOrders]
      responses:
        "200":
          description: Updated
    delete:
      operationId: deletePurchaseOrder
      summary: Delete a purchase order (DRAFT only)
      tags: [PurchaseOrders]
      responses:
        "204":
          description: Deleted
        "409":
          description: Order not in DRAFT state

  /purchase-orders/{id}/confirm/:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: confirmPurchaseOrder
      summary: Transition from DRAFT to CONFIRMED
      tags: [PurchaseOrders]
      responses:
        "200":
          description: Order confirmed — line items locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
        "409":
          description: Invalid state transition

  /purchase-orders/{id}/cancel/:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: cancelPurchaseOrder
      summary: Cancel a purchase order (from DRAFT, CONFIRMED, or PARTIAL_RECEIVED)
      tags: [PurchaseOrders]
      responses:
        "200":
          description: Order cancelled
        "409":
          description: Invalid state transition (already RECEIVED or CANCELLED)

  /purchase-orders/{id}/goods-receipts/:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: listGoodsReceiptsForPO
      summary: List goods receipts for a purchase order
      tags: [GoodsReceipts]
      responses:
        "200":
          description: List of goods receipts
    post:
      operationId: createGoodsReceipt
      summary: Record a goods receipt against a confirmed PO
      tags: [GoodsReceipts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoodsReceiptCreate"
      responses:
        "201":
          description: Goods receipt created — stock movements generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoodsReceipt"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: PO not in receivable state or over-receipt

  /goods-receipts/:
    get:
      operationId: listAllGoodsReceipts
      summary: List all goods receipts for current tenant
      tags: [GoodsReceipts]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Paginated goods receipt list

  /goods-receipts/{id}/:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getGoodsReceipt
      summary: Retrieve a goods receipt with line details
      tags: [GoodsReceipts]
      responses:
        "200":
          description: Goods receipt details with lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoodsReceipt"

components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CursorParam:
      name: cursor
      in: query
      schema:
        type: string

  responses:
    ValidationError:
      description: Validation error (RFC 9457 Problem+JSON)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    SupplierCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        tax_id:
          type: string
          description: CUIT — encrypted at rest
        contact_info:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        lead_time_days:
          type: integer
        is_active:
          type: boolean
          default: true
        custom_data:
          type: object

    SupplierPatch:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        is_active:
          type: boolean
        custom_data:
          type: object

    Supplier:
      allOf:
        - $ref: "#/components/schemas/SupplierCreate"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    PaginatedSupplierList:
      type: object
      properties:
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/Supplier"

    PurchaseOrderItemCreate:
      type: object
      required: [product_id, quantity, unit_price]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: number
          minimum: 0.001
        unit_price:
          type: number
          minimum: 0

    PurchaseOrderCreate:
      type: object
      required: [supplier_id, items]
      properties:
        supplier_id:
          type: string
          format: uuid
        order_date:
          type: string
          format: date
        expected_delivery_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
        custom_data:
          type: object
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PurchaseOrderItemCreate"

    PurchaseOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        supplier_id:
          type: string
          format: uuid
        order_number:
          type: string
        status:
          type: string
          enum: [DRAFT, CONFIRMED, PARTIAL_RECEIVED, RECEIVED, CANCELLED]
        order_date:
          type: string
          format: date
        expected_delivery_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
        custom_data:
          type: object
        total_amount:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderItem"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PurchaseOrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        quantity:
          type: number
        unit_price:
          type: number
        line_total:
          type: number
        received_quantity:
          type: number

    GoodsReceiptLineCreate:
      type: object
      required: [purchase_order_item_id, quantity_received]
      properties:
        purchase_order_item_id:
          type: string
          format: uuid
        quantity_received:
          type: number
          minimum: 0.001

    GoodsReceiptCreate:
      type: object
      required: [lines]
      properties:
        notes:
          type: string
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GoodsReceiptLineCreate"

    GoodsReceipt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        purchase_order_id:
          type: string
          format: uuid
        receipt_number:
          type: string
        receipt_date:
          type: string
          format: date
        notes:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/GoodsReceiptLine"
        created_at:
          type: string
          format: date-time

    GoodsReceiptLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        purchase_order_item_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        quantity_received:
          type: number
