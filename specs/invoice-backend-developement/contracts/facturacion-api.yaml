openapi: 3.0.3
info:
  title: GRAVITEA-ERP Facturacion API
  description: |
    Electronic invoicing endpoints for Argentina's ARCA (ex-AFIP) integration.
    All endpoints require JWT authentication and operate within tenant context.
  version: 1.0.0
  contact:
    name: GRAVITEA Team

servers:
  - url: /api/v1/facturacion
    description: Facturacion API base path

security:
  - bearerAuth: []

tags:
  - name: credentials
    description: ARCA certificate and credential management
  - name: puntos-de-venta
    description: Punto de Venta management
  - name: comprobantes
    description: Invoice issuance and retrieval
  - name: caea
    description: CAEA offline authorization

paths:
  /credentials/:
    get:
      tags: [credentials]
      operationId: listCredentials
      summary: List tenant's ARCA credentials
      responses:
        "200":
          description: List of credentials (private keys redacted)
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/ARCACredentialRead"
    post:
      tags: [credentials]
      operationId: createCredential
      summary: Upload ARCA certificate and private key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ARCACredentialWrite"
      responses:
        "201":
          description: Credential created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ARCACredentialRead"
        "400":
          description: Validation error (duplicate environment, invalid PEM)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /credentials/{id}/:
    get:
      tags: [credentials]
      operationId: getCredential
      summary: Retrieve a credential (private key redacted)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Credential details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ARCACredentialRead"
        "404":
          description: Not found
    patch:
      tags: [credentials]
      operationId: updateCredential
      summary: Update credential (certificate rotation)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ARCACredentialUpdate"
      responses:
        "200":
          description: Credential updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ARCACredentialRead"
    delete:
      tags: [credentials]
      operationId: deleteCredential
      summary: Deactivate a credential
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Credential deactivated

  /puntos-de-venta/:
    get:
      tags: [puntos-de-venta]
      operationId: listPuntosDeVenta
      summary: List tenant's puntos de venta
      responses:
        "200":
          description: List of puntos de venta
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/PuntoDeVenta"
    post:
      tags: [puntos-de-venta]
      operationId: createPuntoDeVenta
      summary: Register a new punto de venta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuntoDeVentaWrite"
      responses:
        "201":
          description: Punto de venta created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuntoDeVenta"

  /comprobantes/:
    get:
      tags: [comprobantes]
      operationId: listComprobantes
      summary: List comprobantes with cursor pagination
      description: |
        Returns comprobantes ordered by created_at (cursor-based pagination).
        Default page size: 100, max: 1000.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: Cursor for pagination
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, VALIDANDO, AUTORIZADO, OBSERVADO, RECHAZADO]
          description: Filter by status
        - name: cbte_tipo
          in: query
          schema:
            type: integer
          description: Filter by comprobante type
        - name: cbte_fch_from
          in: query
          schema:
            type: string
            format: date
          description: Filter by invoice date (from)
        - name: cbte_fch_to
          in: query
          schema:
            type: string
            format: date
          description: Filter by invoice date (to)
      responses:
        "200":
          description: Paginated list of comprobantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    type: string
                    nullable: true
                    description: URL for next page
                  previous:
                    type: string
                    nullable: true
                    description: URL for previous page
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/ComprobanteRead"

  /comprobantes/emitir/:
    post:
      tags: [comprobantes]
      operationId: emitirComprobante
      summary: Issue an invoice and request CAE from ARCA
      description: |
        Full invoice issuance workflow:
        1. Validates amounts (master equation + IVA breakdown)
        2. Authenticates with WSAA (or uses cached token)
        3. Queries FECompUltimoAutorizado for next CbteNro
        4. Submits FECAESolicitar to ARCA
        5. Returns authorized comprobante with CAE

        Synchronous — blocks until ARCA responds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComprobanteEmitir"
      responses:
        "201":
          description: Invoice authorized (CAE granted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteRead"
        "400":
          description: Validation error (amounts, dates, types)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: ARCA rejected the invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ARCARejectionResponse"
        "502":
          description: ARCA service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /comprobantes/{id}/:
    get:
      tags: [comprobantes]
      operationId: getComprobante
      summary: Retrieve a comprobante by ID
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Comprobante details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteRead"
        "404":
          description: Not found

  /comprobantes/{id}/qr/:
    get:
      tags: [comprobantes]
      operationId: getComprobanteQR
      summary: Get fiscal QR code URL for an authorized comprobante
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: QR code URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  qr_url:
                    type: string
                    format: uri
                    example: "https://www.afip.gob.ar/fe/qr/?p=eyJ2ZXIiOjEs..."
        "400":
          description: Comprobante not yet authorized

  /caea/:
    get:
      tags: [caea]
      operationId: listCAEA
      summary: List tenant's CAEA codes
      responses:
        "200":
          description: List of CAEA records
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/CAEA"

  /caea/solicitar/:
    post:
      tags: [caea]
      operationId: solicitarCAEA
      summary: Request a CAEA for a biweekly period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [punto_venta_numero, periodo, orden]
              properties:
                punto_venta_numero:
                  type: integer
                  example: 1
                periodo:
                  type: string
                  pattern: "^[0-9]{6}$"
                  example: "202603"
                orden:
                  type: integer
                  enum: [1, 2]
                  example: 1
      responses:
        "201":
          description: CAEA granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CAEA"
        "502":
          description: ARCA service unavailable

  /caea/{id}/informar/:
    post:
      tags: [caea]
      operationId: informarCAEA
      summary: Batch report CAEA invoices to ARCA
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Batch report results
          content:
            application/json:
              schema:
                type: object
                properties:
                  reported_count:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: object

  /caea/{id}/sin-movimiento/:
    post:
      tags: [caea]
      operationId: sinMovimientoCAEA
      summary: Report no-movement for a CAEA period
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: No-movement reported

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ARCACredentialWrite:
      type: object
      required: [cuit_holder, certificate_pem, private_key_pem]
      properties:
        cuit_holder:
          type: string
          pattern: "^[0-9]{11}$"
          example: "20123456789"
          description: Certificate holder CUIT (11 digits, no hyphens)
        cuit_represented:
          type: string
          pattern: "^[0-9]{11}$"
          nullable: true
          description: Represented company CUIT (delegation model)
        certificate_pem:
          type: string
          description: X.509 certificate in PEM format
        private_key_pem:
          type: string
          description: RSA private key in PEM format (stored encrypted)
        is_production:
          type: boolean
          default: false

    ARCACredentialUpdate:
      type: object
      properties:
        certificate_pem:
          type: string
        private_key_pem:
          type: string
        is_active:
          type: boolean

    ARCACredentialRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cuit_holder:
          type: string
        cuit_represented:
          type: string
          nullable: true
        is_production:
          type: boolean
        is_active:
          type: boolean
        certificate_expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    PuntoDeVenta:
      type: object
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: integer
          minimum: 1
          maximum: 99999
        tipo:
          type: string
          enum: [electronic, manual]
        description:
          type: string
        is_active:
          type: boolean
        fecha_alta:
          type: string
          format: date
          nullable: true

    PuntoDeVentaWrite:
      type: object
      required: [numero]
      properties:
        numero:
          type: integer
          minimum: 1
          maximum: 99999
        tipo:
          type: string
          enum: [electronic, manual]
          default: electronic
        description:
          type: string
          default: ""

    ComprobanteEmitir:
      type: object
      required:
        - punto_venta_numero
        - cbte_tipo
        - concepto
        - doc_tipo
        - doc_nro
        - cbte_fch
        - imp_total
        - imp_neto
        - imp_iva
        - imp_trib
        - imp_op_ex
        - imp_tot_conc
        - emitter_condicion_iva
        - receptor_condicion_iva
      properties:
        punto_venta_numero:
          type: integer
          description: Punto de venta number
        cbte_tipo:
          type: integer
          description: "CbteTipo code (1,2,3,6,7,8,11,12,13,51,52,53)"
        concepto:
          type: integer
          enum: [1, 2, 3]
          description: "1=Products, 2=Services, 3=Both"
        doc_tipo:
          type: integer
          description: "Buyer document type (80=CUIT, 96=DNI, 99=CF)"
        doc_nro:
          type: string
          description: Buyer document number
        cbte_fch:
          type: string
          pattern: "^[0-9]{8}$"
          description: "Invoice date YYYYMMDD"
          example: "20260310"
        fch_serv_desde:
          type: string
          pattern: "^[0-9]{8}$"
          nullable: true
          description: "Service start date (required for Concepto 2,3)"
        fch_serv_hasta:
          type: string
          pattern: "^[0-9]{8}$"
          nullable: true
          description: "Service end date (required for Concepto 2,3)"
        fch_vto_pago:
          type: string
          pattern: "^[0-9]{8}$"
          nullable: true
          description: "Payment due date (required for Concepto 2,3)"
        imp_total:
          type: string
          format: decimal
          description: "Total amount DECIMAL(17,3)"
        imp_neto:
          type: string
          format: decimal
          description: "Net taxable amount"
        imp_iva:
          type: string
          format: decimal
          description: "Total IVA"
        imp_trib:
          type: string
          format: decimal
          description: "Other taxes"
        imp_op_ex:
          type: string
          format: decimal
          description: "IVA-exempt amount"
        imp_tot_conc:
          type: string
          format: decimal
          description: "Non-taxable amount"
        mon_id:
          type: string
          default: "PES"
          description: "Currency code"
        mon_cotiz:
          type: string
          format: decimal
          default: "1.000000"
          description: "Exchange rate"
        emitter_condicion_iva:
          type: integer
          description: "Emitter CondicionIVA (1=RI, 4=Exento, 5=CF, 6=Mono)"
        receptor_condicion_iva:
          type: integer
          description: "Buyer CondicionIVA"
        alic_iva:
          type: array
          description: "IVA breakdown (mandatory for types A/B/M, omit for C)"
          items:
            type: object
            required: [iva_id, base_imp, importe]
            properties:
              iva_id:
                type: integer
                enum: [3, 4, 5, 6, 8, 9]
                description: "ARCA IVA code"
              base_imp:
                type: string
                format: decimal
              importe:
                type: string
                format: decimal
        tributos:
          type: array
          description: "Other taxes (omit entirely if imp_trib=0)"
          items:
            type: object
            required: [tributo_id, desc, base_imp, alic, importe]
            properties:
              tributo_id:
                type: integer
              desc:
                type: string
              base_imp:
                type: string
                format: decimal
              alic:
                type: string
                format: decimal
              importe:
                type: string
                format: decimal
        cbtes_asoc:
          type: array
          description: "Associated comprobantes (for NC/ND)"
          items:
            type: object
            required: [tipo, pto_vta, nro]
            properties:
              tipo:
                type: integer
              pto_vta:
                type: integer
              nro:
                type: integer
              cuit:
                type: string
                nullable: true

    ComprobanteRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        punto_venta_numero:
          type: integer
        cbte_tipo:
          type: integer
        cbte_nro:
          type: integer
        concepto:
          type: integer
        doc_tipo:
          type: integer
        doc_nro:
          type: string
        cbte_fch:
          type: string
          format: date
        imp_total:
          type: string
          format: decimal
        imp_neto:
          type: string
          format: decimal
        imp_iva:
          type: string
          format: decimal
        imp_trib:
          type: string
          format: decimal
        imp_op_ex:
          type: string
          format: decimal
        imp_tot_conc:
          type: string
          format: decimal
        mon_id:
          type: string
        mon_cotiz:
          type: string
          format: decimal
        cae:
          type: string
          nullable: true
          description: "14-digit CAE (null if not yet authorized)"
        cae_fch_vto:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [DRAFT, VALIDANDO, AUTORIZADO, OBSERVADO, RECHAZADO]
        arca_errors:
          type: array
          nullable: true
          items:
            type: object
        qr_url:
          type: string
          format: uri
          nullable: true
          description: "Fiscal QR URL (only for authorized comprobantes)"
        created_at:
          type: string
          format: date-time
        alic_iva:
          type: array
          items:
            type: object
            properties:
              iva_id:
                type: integer
              base_imp:
                type: string
                format: decimal
              importe:
                type: string
                format: decimal
        tributos:
          type: array
          items:
            type: object
            properties:
              tributo_id:
                type: integer
              desc:
                type: string
              base_imp:
                type: string
                format: decimal
              alic:
                type: string
                format: decimal
              importe:
                type: string
                format: decimal
        cbtes_asoc:
          type: array
          items:
            type: object
            properties:
              tipo:
                type: integer
              pto_vta:
                type: integer
              nro:
                type: integer

    CAEA:
      type: object
      properties:
        id:
          type: string
          format: uuid
        punto_venta_numero:
          type: integer
        caea_code:
          type: string
          description: "14-digit CAEA code"
        periodo:
          type: string
          description: "YYYYMM"
        orden:
          type: integer
          enum: [1, 2]
        fch_vig_desde:
          type: string
          format: date
        fch_vig_hasta:
          type: string
          format: date
        fch_tope_inf:
          type: string
          format: date
          description: "Reporting deadline"
        status:
          type: string
          enum: [ACTIVE, REPORTED, REPORTED_NO_MOVEMENT, EXPIRED]
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string

    ARCARejectionResponse:
      type: object
      properties:
        detail:
          type: string
        comprobante_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [RECHAZADO]
        arca_errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: integer
              msg:
                type: string
        observations:
          type: array
          items:
            type: object
            properties:
              code:
                type: integer
              msg:
                type: string
