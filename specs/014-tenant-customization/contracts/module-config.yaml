openapi: 3.0.3
info:
  title: Tenant Module Configuration API
  version: "1.0"
  description: |
    Read-only endpoint for retrieving tenant-scoped module activation status.
    Used by frontend to determine which ERP modules are available for the current tenant.

paths:
  /api/v1/module-config/:
    get:
      operationId: listModuleConfig
      summary: List module configurations for current tenant
      description: |
        Returns all module configuration records scoped to the authenticated user's tenant.
        Each record indicates whether a module is enabled and any module-specific settings.
      tags:
        - Customization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of module configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleConfig"
              example:
                - id: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                  module: "inventario"
                  enabled: true
                  settings: {}
                - id: "d4e5f6a7-b8c9-0123-defa-234567890123"
                  module: "ventas"
                  enabled: true
                  settings: {}
                - id: "e5f6a7b8-c9d0-1234-efab-345678901234"
                  module: "facturacion"
                  enabled: true
                  settings: {}
                - id: "f6a7b8c9-d0e1-2345-fabc-456789012345"
                  module: "sync"
                  enabled: false
                  settings: {}
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: "Authentication credentials were not provided."

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ModuleConfig:
      type: object
      required:
        - id
        - module
        - enabled
      properties:
        id:
          type: string
          format: uuid
        module:
          type: string
          enum: [inventario, ventas, facturacion, sync]
          description: ERP module identifier
        enabled:
          type: boolean
          description: Whether the module is active for this tenant
        settings:
          type: object
          additionalProperties: true
          description: Module-specific settings (future extensibility)

    Error:
      type: object
      properties:
        detail:
          type: string
